global:
  pattern: ansible-edge-gitops
  secretLoader:
    disabled: false
  hub:
    provider: aws
  options:
    installPlanApproval: Automatic
    syncPolicy: Automatic
    useCSV: false
  singleArgoCD: true

main:
  variant: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: 0.9.*
